
<div class="stock-table-container">

  <h3>All Stocks</h3>

  <table>

    <thead>
      <tr>
        <th>Company</th>
        <th>Symbol</th>
        <th>Price</th>
        <th>Change</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>

      @for (stock of stocks; track stock.symbol) {

        <tr>

          <td>{{ stock.name }}</td>

          <td>{{ stock.symbol }}</td>

          <td>${{ stock.price | number:'1.2-2' }}</td>

          <td
            [class.positive]="stock.change > 0"
            [class.negative]="stock.change < 0">

            {{ stock.change > 0 ? '+' : '' }}
            {{ stock.change | number:'1.2-2' }}%

          </td>

          <td>
            <button
              type="button"
              (click)="selectStock(stock)">

              View

            </button>
          </td>

        </tr>

      } @empty {

        <tr>
          <td colspan="5">No stock data available</td>
        </tr>

      }

    </tbody>

  </table>

</div>
